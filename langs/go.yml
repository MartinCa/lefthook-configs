# langs/go.yml
#
# Go formatting `pre-commit` hooks.
#
# Consume it from a project's `lefthook.yml` via `remotes:` (see README):
#
#   remotes:
#     - git_url: https://github.com/MartinCa/lefthook-configs
#       ref: v2.0.0
#       configs:
#         - langs/go.yml
#
# Requirements:
#   - gofmt, shipped with Go toolchains (`gofmt -w` rewrites files in place).
#   - goimports (golang.org/x/tools/cmd/goimports) — install it explicitly,
#     it is not part of the Go distribution:
#       go install golang.org/x/tools/cmd/goimports@latest
#
# Both commands use `stage_fixed: true` to re-stage reformatted files.
#
# Ordering when consumed: hook-level keys are last-writer-wins across the
# `configs:` list in listed order — list lefthook-shared.yml BEFORE this
# fragment, or its `parallel: true` discards this fragment's `parallel: false`
# and the v2.0.1 serialization race fix is lost (ref: #8).
#
# `parallel: false` is deliberate: gofmt and goimports both rewrite the same
# staged *.go files, so running them concurrently races two writers per file
# (same bug class as langs/python.yml). Serialized commands run alphabetically:
# gofmt < goimports, so goimports — a superset of gofmt (import grouping +
# gofmt formatting) — runs last and the final file is goimports-canonical.
pre-commit:
  parallel: false
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    goimports:
      glob: "*.go"
      run: goimports -w {staged_files}
      stage_fixed: true