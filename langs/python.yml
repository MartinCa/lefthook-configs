# langs/python.yml
#
# Python linting + formatting `pre-commit` hooks powered by Ruff.
#
# Consume it from a project's `lefthook.yml` via `remotes:` (see README):
#
#   remotes:
#     - git_url: https://github.com/MartinCa/lefthook-configs
#       ref: v2.0.0
#       configs:
#         - langs/python.yml
#
# Requirements: `uv` (astral-sh/uv) on PATH — `uvx ruff` runs Ruff without
# installing it into the consumer project. `stage_fixed: true` re-stages the
# files Ruff rewrote before the commit continues.
#
# Command names are suffixed (`lint-python`/`format-python`) so this fragment
# can be consumed together with langs/ts.yml — lefthook merges same-named
# commands key-by-key, which previously made the TS hooks lose to these (ref: #5).
#
# Ordering when consumed: hook-level keys are last-writer-wins across the
# `configs:` list in listed order — list lefthook-shared.yml BEFORE this
# fragment, or its `parallel: true` discards this fragment's `parallel: false`
# and the v2.0.1 serialization race fix is lost (ref: #8).
#
# `parallel: false` is deliberate: both commands rewrite the same staged files
# (`{staged_files}` globs are identical), so running them concurrently races two
# writers on each file and drops one of the rewrites — observed losing the fix
# in 3/4 runs of the Phase-3 check, while exit 0 + `stage_fixed` hid the drift.
# Serializing is what fixes the race. Sequential commands run alphabetically —
# `format-python` before `lint-python` regardless of config order — and each
# command re-reads the file, so both fixes land deterministically (ruff running
# after the autofix would be nicer, but alphabetical order is already safe;
# `priority:` exists if exact ordering ever matters).
pre-commit:
  parallel: false
  commands:
    lint-python:
      glob: "*.{py,pyi}"
      run: uvx ruff check --fix {staged_files}
      stage_fixed: true
    format-python:
      glob: "*.{py,pyi}"
      run: uvx ruff format {staged_files}
      stage_fixed: true
