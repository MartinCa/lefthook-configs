# langs/shell.yml
#
# Shell script formatting + linting `pre-commit` hooks.
#
# Consume it from a project's `lefthook.yml` via `remotes:` (see README):
#
#   remotes:
#     - git_url: https://github.com/MartinCa/lefthook-configs
#       ref: v2.1.0
#       configs:
#         - langs/shell.yml
#
# Requirements: `shfmt` (mvdan/sh) and `shellcheck` on PATH.
#
# `format-shell` rewrites files in place (stage_fixed).
# `lint-shell` runs shellcheck and FAILS the commit on findings — this is
# intentional: for shell script linting a hard gate beats an advisory.
#
# Command names are suffixed (`lint-shell`/`format-shell`) so this fragment
# can be consumed together with langs/ts.yml — lefthook merges same-named
# commands key-by-key, which previously made the TS hooks lose (refs: #5).
pre-commit:
  parallel: true
  commands:
    format-shell:
      glob: "*.{sh,bash}"
      run: shfmt -w {staged_files}
      stage_fixed: true
    lint-shell:
      glob: "*.{sh,bash}"
      # -x follows sourced files, so a commit staging only a script that sources a sibling (e.g. `source "$(dirname "$0")/lib.sh"`) no longer blocks on info-level SC1091; stricter, disables nothing (fixes #7).
      run: shellcheck -x {staged_files}
